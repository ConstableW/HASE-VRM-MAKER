[package]
name = "hase-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.2"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "accesskit"] }
hase-core = { version = "0.1.0", path = "../hase-core" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
memory-stats = "1.2.0"
pollster = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wgpu = "30.0.1"
