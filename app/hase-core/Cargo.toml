[package]
name = "hase-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
flate2 = "1.1.10"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
gltf = { version = "1", default-features = false, features = ["names", "extensions", "extras", "utils"] }
