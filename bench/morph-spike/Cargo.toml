[package]
name = "morph-spike"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[dependencies]
bytemuck = "1.25.2"
egui = "0.37.0"
flate2 = "1.1.10"
memory-stats = "1.2.0"
pollster = "1.0.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wgpu = "30.0.1"
